[workspace]

members = [
    "pacs/*",
    "tests/*",
    "xtask"
]

[workspace.package]
description = "Peripheral Access Crates (PACs) for TI SimpleLink Microcontrollers"
version = "0.1.0"
keywords = ["no-std", "cortex-m", "ti", "cc23xx"]
license = "BSD-3-Clause"
license-file = "LICENSE.txt"
repository = "https://github.com/TexasInstruments-Sandbox/ti-simplelink-pacs"
edition = "2018"
readme = "README.md"

[workspace.dependencies]
critical-section = "1.0"
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
vcell = "0.1.2"
bitfield-struct = "0.9.2"
crc = "3.2.1"

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations
