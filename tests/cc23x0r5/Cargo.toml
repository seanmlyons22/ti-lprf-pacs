[package]
authors = ["Sean Lyons"]
edition = "2018"
readme = "README.md"
name = "cc23x0r5"
version = "0.1.0"

[dependencies]
cortex-m.workspace = true
cortex-m.features = ["critical-section-single-core"]
vcell.workspace = true
cortex-m-rt.workspace = true
critical-section.workspace = true
panic-halt = "0.2.0"
cc23x0r5_pac = { path = "../../pacs/cc23x0r5", features = ["critical-section", "rt"]}
rtt-target = { version = "0.6.1", features = ["defmt"] }
defmt = { version = "0.3.8"}

[dev-dependencies]
embedded-test = { version = "0.6.0", features=["defmt"]}

# this lets you use `cargo fix`!
[[bin]]
name = "cc23x0r5"
test = false
bench = false

[[test]]
name = "example_test"
harness = false # Important: As we bring our own test harness, we need to disable the default one

